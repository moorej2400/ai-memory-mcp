[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-memory-mcp"
version = "0.1.0"
description = "Hybrid AI-memory retrieval MCP built around Graphify"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.urls]
Documentation = "docs/architecture.md"

[project.scripts]
ai-memory-mcp = "ai_memory_mcp.server:main"
ai-memory-index = "ai_memory_mcp.cli:index_main"
ai-memory-benchmark = "ai_memory_mcp.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_memory_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
